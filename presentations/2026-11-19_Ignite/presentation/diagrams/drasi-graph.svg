  <text x="82" y="568" class="title">OpenTelemetry</text>
  <text x="82" y="596" class="title">source</text>
  <text x="82" y="630" class="sub">Health probes from</text>
  <text x="82" y="652" class="sub">the AI service, every</text>
  <text x="82" y="674" class="sub">second, via the Collector</text>
  <text x="82" y="708" class="desc">ignite_probe_status</text>
  <rect x="310" y="230" width="290" height="65" rx="12" class="box"/>
