<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI', 'Segoe UI Web', 'Helvetica Neue', Arial, sans-serif">
  <title>Inside Drasi: the demo's computation graph</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9D9D6"/>
    </marker>
    <symbol id="clock" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#FFE399" stroke-width="2"/>
      <path d="M10,5 V10 L13.5,12.5" fill="none" stroke="#FFE399" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <style>
      .box { fill: #091F2C; fill-opacity: .45; stroke: #D9D9D6; stroke-opacity: .45; stroke-width: 2; }
      .model { fill: #091F2C; fill-opacity: .6; stroke: #8DE971; stroke-width: 2.5; }
      .group { fill: none; stroke: #8DE971; stroke-width: 2; stroke-dasharray: 7 6; }
      .out { fill: #091F2C; fill-opacity: .6; stroke: #D4EC8E; stroke-width: 2; }
      .name { fill: #FFFFFF; font-size: 19px; font-weight: 600; }
      .desc { fill: #D9D9D6; font-size: 15px; }
      .title { fill: #FFFFFF; font-size: 24px; font-weight: 600; }
      .sub { fill: #D9D9D6; font-size: 17px; }
      .accent { fill: #D4EC8E; font-size: 15px; }
      .accent-model { fill: #8DE971; font-size: 15px; }
      .tile { fill: #8DC8E8; font-size: 15px; }
      .label { fill: #D9D9D6; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
      .note { fill: #D9D9D6; font-size: 14px; font-style: italic; }
      .head { fill: #D9D9D6; font-size: 15px; font-weight: 600; letter-spacing: 2px; }
      .flow { fill: none; stroke: #D9D9D6; stroke-width: 2.2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #D9D9D6; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#2A446F"/>
  <text x="60" y="82" fill="#FFFFFF" font-size="48" font-weight="600" font-family="'Segoe Sans Display', 'Segoe UI', Arial, sans-serif">Inside Drasi: the demo's computation graph</text>
  <text x="60" y="122" class="sub" font-size="22">Changes flow left to right. Every answer stays current as data changes and as time passes, and reactions deliver it. 59 components in one Drasi Server.</text>
  <text x="60" y="205" class="head">SOURCES</text>
  <text x="310" y="205" class="head">CONTINUOUS QUERIES</text>
  <text x="650" y="205" class="head">CONTINUOUS MODELS</text>
  <text x="940" y="205" class="head">CONTINUOUS QUERIES</text>
  <text x="1620" y="205" class="head">REACTIONS</text>
  <rect x="60" y="230" width="210" height="290" rx="16" class="box"/>
  <text x="82" y="268" class="title">PostgreSQL</text>
  <text x="82" y="296" class="title">source</text>
  <text x="82" y="330" class="sub">Change feed from one</text>
  <text x="82" y="352" class="sub">replication slot; each</text>
  <text x="82" y="374" class="sub">query starts from a</text>
  <text x="82" y="396" class="sub">snapshot (bootstrap)</text>
  <text x="82" y="438" class="desc">scenario · workloads</text>
  <text x="82" y="457" class="desc">deployments · routes</text>
  <text x="82" y="476" class="desc">policy · approvals</text>
  <text x="82" y="495" class="desc">tasks · attempts</text>
