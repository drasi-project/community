<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Aptos, 'Segoe UI', Arial, sans-serif">
  <title>Inside Drasi: the demo's computation graph</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bdc5d3"/>
    </marker>
    <symbol id="clock" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#ffd48a" stroke-width="2"/>
      <path d="M10,5 V10 L13.5,12.5" fill="none" stroke="#ffd48a" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <style>
      .box { fill: #1a202b; stroke: #3a4351; stroke-width: 2; }
      .model { fill: #142a2b; stroke: #9ee8d7; stroke-width: 2.5; }
      .out { fill: #1a202b; stroke: #9ee8d7; stroke-width: 2; }
      .name { fill: #eeeef2; font-size: 19px; font-weight: 700; }
      .desc { fill: #bdc5d3; font-size: 15px; }
      .title { fill: #eeeef2; font-size: 24px; font-weight: 700; }
      .sub { fill: #bdc5d3; font-size: 17px; }
      .accent { fill: #9ee8d7; }
      .head { fill: #bdc5d3; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .flow { fill: none; stroke: #bdc5d3; stroke-width: 2.2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #bdc5d3; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#10141c"/>
  <text x="60" y="82" fill="#eeeef2" font-size="44" font-weight="700">Inside Drasi: the demo's computation graph</text>
  <text x="60" y="122" class="sub" font-size="22">Changes flow left to right. Every result stays current as data changes and as time passes.</text>

  <text x="60" y="205" class="head">SOURCES</text>
  <text x="420" y="205" class="head">CONTINUOUS QUERIES</text>
  <text x="840" y="205" class="head">CONTINUOUS MODELS</text>
  <text x="1200" y="205" class="head">CONTINUOUS QUERIES</text>
  <text x="1580" y="205" class="head">RESULTS</text>

  <!-- Sources -->
  <rect x="60" y="230" width="280" height="680" rx="16" class="box"/>
  <text x="84" y="274" class="title">PostgreSQL</text>
  <text x="84" y="302" class="title">source</text>
  <text x="84" y="342" class="sub">Change feed (CDC) from</text>
  <text x="84" y="366" class="sub">one replication slot</text>
  <text x="84" y="406" class="sub">Each query bootstraps</text>
  <text x="84" y="430" class="sub">from a snapshot, then</text>
  <text x="84" y="454" class="sub">follows live changes</text>
  <text x="84" y="510" class="desc">Tasks · attempts · reports</text>
  <text x="84" y="534" class="desc">deployments · model and policy</text>
  <text x="84" y="558" class="desc">commands · alerts</text>
  <rect x="60" y="946" width="280" height="56" rx="14" class="box"/>
  <text x="84" y="981" class="name">HTTP source <tspan class="desc">· alert webhooks</tspan></text>

  <!-- Context queries -->
  <rect x="420" y="230" width="300" height="64" rx="12" class="box"/>
  <text x="444" y="258" class="name">endpoint-context</text>
  <text x="444" y="281" class="desc">Deployment state and capacity</text>
  <rect x="420" y="314" width="300" height="64" rx="12" class="box"/>
  <text x="444" y="342" class="name">decision-context</text>
  <text x="444" y="365" class="desc">Fresh decision inputs</text>
  <use href="#clock" x="680" y="324" width="22" height="22"/>
  <rect x="420" y="580" width="300" height="64" rx="12" class="box"/>
  <text x="444" y="608" class="name" font-size="17">recovery-task-context</text>
  <text x="444" y="631" class="desc">Support task progress</text>
  <rect x="420" y="664" width="300" height="64" rx="12" class="box"/>
  <text x="444" y="692" class="name" font-size="17">recovery-observation-context</text>
  <text x="444" y="715" class="desc">Applied commands, reports</text>
  <rect x="420" y="760" width="700" height="160" rx="12" class="box"/>
  <text x="444" y="792" class="name">More continuous queries <tspan class="desc">· published directly</tspan></text>
  <text x="444" y="826" class="desc" font-size="17">task-context</text>
  <text x="444" y="854" class="desc" font-size="17">overdue-tasks</text>
  <use href="#clock" x="560" y="838" width="20" height="20"/>
  <text x="444" y="882" class="desc" font-size="17">deadline-history</text>
  <use href="#clock" x="583" y="866" width="20" height="20"/>
  <text x="444" y="910" class="desc" font-size="17">endpoint-freshness</text>
  <use href="#clock" x="600" y="894" width="20" height="20"/>
  <text x="790" y="826" class="desc" font-size="17">attempt-context</text>
  <text x="790" y="854" class="desc" font-size="17">breach-history</text>
  <text x="790" y="882" class="desc" font-size="17">alert-context</text>
  <text x="790" y="910" class="desc" font-size="17">model-context</text>
  <rect x="420" y="946" width="300" height="56" rx="12" class="box"/>
  <text x="444" y="981" class="name">grafana-alerts</text>

  <!-- Continuous models -->
  <rect x="840" y="230" width="280" height="64" rx="12" class="model"/>
  <text x="864" y="258" class="name">capacity</text>
  <text x="864" y="281" class="desc">Spare capacity per deployment</text>
  <rect x="840" y="314" width="280" height="64" rx="12" class="model"/>
  <text x="864" y="342" class="name">policy</text>
  <text x="864" y="365" class="desc">Policy · Rego</text>
  <rect x="840" y="398" width="280" height="64" rx="12" class="model"/>
  <text x="864" y="426" class="name">allocation</text>
  <text x="864" y="449" class="desc">Planner: best complete plan</text>
  <rect x="840" y="482" width="280" height="64" rx="12" class="model"/>
  <text x="864" y="510" class="name">resilience</text>
  <text x="864" y="533" class="desc">What-if: lose any one deployment</text>

  <!-- Result queries -->
  <rect x="1200" y="230" width="300" height="64" rx="12" class="box"/>
  <text x="1224" y="258" class="name">capacity-results</text>
  <text x="1224" y="281" class="desc">Current capacity</text>
  <rect x="1200" y="314" width="300" height="64" rx="12" class="box"/>
  <text x="1224" y="342" class="name">policy-results</text>
  <text x="1224" y="365" class="desc">Allowed destinations</text>
  <rect x="1200" y="398" width="300" height="64" rx="12" class="box"/>
  <text x="1224" y="426" class="name">allocation-results</text>
  <text x="1224" y="449" class="desc">Proposed plan</text>
  <rect x="1200" y="482" width="300" height="64" rx="12" class="box"/>
  <text x="1224" y="510" class="name">resilience-results</text>
  <text x="1224" y="533" class="desc">Safe if one fails?</text>
  <rect x="1200" y="622" width="300" height="64" rx="12" class="box"/>
  <text x="1224" y="650" class="name">recovery-results</text>
  <text x="1224" y="673" class="desc">Verified recovery</text>
  <use href="#clock" x="1460" y="632" width="22" height="22"/>

  <!-- Results -->
  <rect x="1580" y="230" width="280" height="170" rx="16" class="out"/>
  <text x="1604" y="272" class="title">Results catalog</text>
  <text x="1604" y="306" class="sub">Current results of</text>
  <text x="1604" y="330" class="sub">every continuous query</text>
  <rect x="1580" y="450" width="280" height="150" rx="16" class="out"/>
  <text x="1604" y="492" class="title">Drasi Server API</text>
  <text x="1604" y="526" class="sub">Snapshot first, then</text>
  <text x="1604" y="550" class="sub">live result changes</text>
  <rect x="1580" y="650" width="280" height="352" rx="16" class="model"/>
  <text x="1604" y="692" class="title">Reactions</text>
  <text x="1604" y="728" class="sub accent">Workload service</text>
  <text x="1604" y="756" class="sub">· Grafana metrics</text>
  <text x="1604" y="782" class="sub">· Grafana annotations</text>
  <text x="1604" y="808" class="sub">· Langfuse scores</text>
  <text x="1604" y="834" class="sub">· Gateway decisions</text>
  <text x="1604" y="876" class="sub accent">Presenter desk</text>
  <text x="1604" y="902" class="sub">Approval of the current</text>
  <text x="1604" y="926" class="sub">proposal</text>
  <text x="1604" y="968" class="sub accent">Drasi Server UI</text>

  <!-- Source fan-out -->
  <path d="M340,560 H380" class="line"/>
  <path d="M380,262 V840" class="line"/>
  <path d="M380,262 H420" class="flow"/>
  <path d="M380,346 H420" class="flow"/>
  <path d="M380,612 H420" class="flow"/>
  <path d="M380,696 H420" class="flow"/>
  <path d="M380,840 H420" class="flow"/>
  <path d="M340,974 H420" class="flow"/>

  <!-- Into and between models -->
  <path d="M720,262 H840" class="flow"/>
  <path d="M720,346 H840" class="flow"/>
  <path d="M1120,262 H1200" class="flow"/>
  <path d="M1120,346 H1200" class="flow"/>
  <path d="M1120,430 H1200" class="flow"/>
  <path d="M1120,514 H1200" class="flow"/>
  <path d="M1350,378 V388 H800 V430 H840" class="flow"/>
  <path d="M800,430 V514 H840" class="flow"/>
  <path d="M720,612 H1160 V640 H1200" class="flow"/>
  <path d="M720,696 H1160 V668 H1200" class="flow"/>

  <!-- Into results -->
  <path d="M1500,262 H1540" class="line"/>
  <path d="M1500,346 H1540" class="line"/>
  <path d="M1500,430 H1540" class="line"/>
  <path d="M1500,514 H1540" class="line"/>
  <path d="M1500,654 H1540" class="line"/>
  <path d="M1120,840 H1540" class="line"/>
  <path d="M720,974 H1540" class="line"/>
  <path d="M1540,262 V974" class="line"/>
  <path d="M1540,315 H1580" class="flow"/>
  <path d="M1720,400 V450" class="flow"/>
  <path d="M1720,600 V650" class="flow"/>

  <!-- Legend -->
  <rect x="60" y="1030" width="34" height="22" rx="6" class="box"/>
  <text x="104" y="1048" class="sub">Continuous query (Cypher)</text>
  <rect x="340" y="1030" width="34" height="22" rx="6" class="model"/>
  <text x="384" y="1048" class="sub">Continuous model (native plugin)</text>
  <use href="#clock" x="680" y="1030" width="22" height="22"/>
  <text x="712" y="1048" class="sub">Time-aware: the result changes as time passes, with no new data</text>
  <text x="1860" y="1048" class="sub" text-anchor="end">26 components in one Drasi Server</text>
</svg>
