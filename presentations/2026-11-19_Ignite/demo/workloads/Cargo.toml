[package]
name = "ignite-workloads"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ignite-domain = { path = "../domain" }
ignite-settings = { path = "../settings" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.33.1", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "http-json", "reqwest-blocking-client", "reqwest-rustls"] }
