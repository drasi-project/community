# Ports and the project name come from ports.env via ops/observability-stack.sh.
name: ${IGNITE_PROJECT:?Run through ops/observability-stack.sh}
x-langfuse-environment: &langfuse-environment
  DATABASE_URL: ${LANGFUSE_DATABASE_URL:?}
  NEXTAUTH_URL: http://localhost:${IGNITE_LANGFUSE_PORT:?}
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ignite
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ignite
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ignite
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: "1000"
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: "1000"
x-langfuse-dependencies: &langfuse-dependencies
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
services:
  postgres:
    image: docker.io/library/postgres:17.6-alpine@sha256:9b9fb55f7e3b2149854def33c728b781dc44d1c5e86492ad62912a527ae234b3
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=24", "-c", "max_wal_senders=24"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run ops/observability-stack.sh env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ignite
    ports: ["127.0.0.1:${IGNITE_POSTGRES_PORT:?}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./observability/postgres/01-langfuse.sql:/docker-entrypoint-initdb.d/01-langfuse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignite -d ignite"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: docker.io/library/redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:b2455f05a197df1d4b99330dcab61b900b293dcdb4e390062cd33b72f19ad628
    entrypoint: /bin/sh
    command: ["-c", "mkdir -p /data/langfuse && minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: ignite
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3@sha256:de3e47c64078aa196dae2349e048fc98ba81947f651f5c20e06e46baea8ae40a
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ignite
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./observability/clickhouse/local.xml:/etc/clickhouse-server/config.d/local.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.76.0@sha256:1219bfe847c06a92c1f4f1476a6bc6b2f1b9a9941fedfab8c75b07279a05818f
    depends_on:
      <<: *langfuse-dependencies
      langfuse-web: {condition: service_healthy}
    environment: *langfuse-environment
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.76.0@sha256:59abb54faacf45b63d09f4076d45683dae26a6661974d497836543d350b16575
    depends_on: *langfuse-dependencies
    ports: ["127.0.0.1:${IGNITE_LANGFUSE_PORT:?}:3000"]
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: ignite
      LANGFUSE_INIT_ORG_NAME: Ignite local demo
      LANGFUSE_INIT_PROJECT_ID: ignite-probe
      LANGFUSE_INIT_PROJECT_NAME: Ignite AI service
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: Local operator
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 48
  collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:19b524dc61144cb50e9dccc9469605706db48e3302ddccda404a0aaf0a99a73f
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LANGFUSE_AUTH_BASE64: ${LANGFUSE_AUTH_BASE64:?}
    ports: ["127.0.0.1:${IGNITE_OTLP_PORT:?}:4318"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:c523006440e714e0e53405b77e9f6ee668871d9855fc1c853fd43f5b990c34d2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${IGNITE_PROMETHEUS_PORT:?}:9090"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      # Scrape targets on the host, written from ports.env by ops/observability-stack.sh.
      - ./.native/prometheus-targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
  grafana:
    image: docker.io/grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports: ["127.0.0.1:${IGNITE_GRAFANA_PORT:?}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: http://localhost:${IGNITE_GRAFANA_PORT:?}
      # Read by provisioning/alerting/workload.yaml: the contact point posts to Drasi's HTTP source.
      IGNITE_DRASI_ALERT_PORT: ${IGNITE_DRASI_ALERT_PORT:?}
      # The projected stage shows dashboards inside the slides page, read-only, without sign-in.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  probe:
    image: localhost/${IGNITE_PROJECT:?}-probe:phase1
    build:
      context: ./observability/probe
      dockerfile: Containerfile
    ports: ["127.0.0.1:${IGNITE_PROBE_PORT:?}:8888"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      DRASI_ALERT_URL: ${DRASI_ALERT_URL:-}
      LANGFUSE_PUBLIC_URL: http://localhost:${IGNITE_LANGFUSE_PORT:?}
    volumes:
      - probe-data:/data
volumes:
  postgres-data:
  redis-data:
  minio-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  probe-data:
