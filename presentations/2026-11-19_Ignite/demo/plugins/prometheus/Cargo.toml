[package]
name = "ignite-prometheus"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "drasi_computation_ignite_prometheus"
crate-type = ["lib", "cdylib"]

[features]
dynamic-plugin = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
futures-util = "0.3"
sha2 = "0.10"
drasi-computation-contracts = { path = "../../../../../../drasi-core/components/computation-contracts" }
drasi-computation-plugin-sdk = { path = "../../../../../../drasi-core/components/computation-plugin-sdk" }
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }

[dev-dependencies]
drasi-computation-plugin-sdk = { path = "../../../../../../drasi-core/components/computation-plugin-sdk", features = ["test-support"] }
drasi-core-types = { path = "../../../../../../drasi-core/core-types" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
