apiVersion: 1
contactPoints:
  - orgId: 1
    name: integration-probe-webhook
    receivers:
      - uid: integration-probe-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://probe:8888/alerts/grafana
          httpMethod: POST
# Every alert goes to the probe's webhook (the smoke test reads it); the AI service's
# alerts (component=workload) also post to #incident-ai-support (workload.yaml), except
# Grafana's own no-data and query-error alerts, which would repeat a rule's summary.
policies:
  - orgId: 1
    receiver: integration-probe-webhook
    group_by: [alertname]
    group_wait: 1s
    group_interval: 5s
    repeat_interval: 1h
    routes:
      - receiver: incident-channel
        object_matchers: [["component", "=", "workload"], ["alertname", "!~", "DatasourceNoData|DatasourceError"]]
        continue: true
      - receiver: integration-probe-webhook
groups:
  - orgId: 1
    name: integration-probe
    folder: AI platform
    interval: 10s
    rules:
      - uid: integration-probe-http-failure
        title: Integration probe HTTP failure
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The integration probe's latest real HTTP request failed.
        labels:
          component: integration-probe
          endpoint_id: probe
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: integration_probe_last_request_failed
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
