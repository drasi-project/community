apiVersion: 1
contactPoints:
  - orgId: 1
    name: ignite-probe-webhook
    receivers:
      - uid: ignite-probe-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://probe:8888/alerts/grafana
          httpMethod: POST
policies:
  - orgId: 1
    receiver: ignite-probe-webhook
    group_by: [alertname]
    group_wait: 1s
    group_interval: 5s
    repeat_interval: 1h
    routes:
      - receiver: drasi-http-source
        object_matchers:
          - [component, "=", workload]
        group_by: [alertname, workload, endpoint]
groups:
  - orgId: 1
    name: integration-probe
    folder: Ignite
    interval: 10s
    rules:
      - uid: ignite-probe-http-failure
        title: Ignite probe HTTP failure
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The integration probe's latest real HTTP request failed.
        labels:
          component: integration-probe
          endpoint_id: probe
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: ignite_probe_last_request_failed
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
