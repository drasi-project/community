apiVersion: 1
contactPoints:
  - orgId: 1
    name: drasi-http-source
    receivers:
      - uid: drasi-http-source
        type: webhook
        disableResolveMessage: false
        settings:
          # Drasi's HTTP source (grafana-input). Grafana expands $IGNITE_DRASI_ALERT_PORT
          # from its environment (compose.yaml, from ports.env).
          url: http://host.containers.internal:$IGNITE_DRASI_ALERT_PORT/alerts/grafana
          httpMethod: POST
groups:
  - orgId: 1
    name: support-workload
    folder: Ignite
    interval: 10s
    rules:
      - uid: ignite-workload-http-failure
        title: Model calls failing
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Model-call errors were measured in the last 30 seconds.
        labels:
          component: workload
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: >-
                (sum by(workload,endpoint) (increase(ignite_workload_requests_total{status!="200"}[30s]))
                or on(workload,endpoint) (0 * sum by(workload,endpoint) (increase(ignite_workload_requests_total[30s]))))
                and on() count(ignite_workload_queue_depth)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
      - uid: ignite-support-overdue
        title: Support requests overdue (Drasi)
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Drasi reports customer-support requests past their 15-second target.
        labels:
          component: workload
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              # Drasi's Prometheus reaction (tile-overdue). No series is 0 only while the
              # reaction's input is ready; otherwise Unknown, which is NoData (OK).
              expr: >-
                max((max(ignite_drasi_overdue_requests{workload="support"})
                and on() (drasi_reaction_input_ready{output="overdue"} == 1))
                or on() ((drasi_reaction_input_ready{output="overdue"} == 1) * 0))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
