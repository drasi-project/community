apiVersion: 1
# The AI service's alerts post to #incident-ai-support through Mattermost's incoming
# webhook (Slack-compatible), as well as to the probe's webhook (routes in probe.yaml).
# Removes the contact point that earlier versions posted to Drasi.
deleteContactPoints:
  - orgId: 1
    uid: drasi-http-source
contactPoints:
  - orgId: 1
    name: incident-channel
    receivers:
      - uid: incident-channel
        type: slack
        disableResolveMessage: false
        settings:
          # http://mattermost:8065/hooks/<id>, written to .env by ops/mattermost.py bootstrap.
          url: ${MATTERMOST_ALERT_WEBHOOK_URL}
          username: Grafana
          title: '{{ if eq .Status "firing" }}Alert firing{{ else }}Resolved{{ end }}: {{ .CommonLabels.alertname }}'
          text: >-
            {{ .CommonAnnotations.summary }}
            [Open AI service · Operations]({{ .ExternalURL }}d/ignite-workload?from=now-5m&to=now&refresh=5s)
groups:
  - orgId: 1
    name: support-workload
    folder: Ignite
    interval: 10s
    rules:
      - uid: ignite-workload-http-failure
        title: Model calls failing
        condition: B
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Model-call errors were measured in the last 30 seconds.
          __dashboardUid__: ignite-workload
          __panelId__: "5"
        labels:
          component: workload
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              expr: >-
                (sum by(workload,endpoint) (increase(ignite_workload_requests_total{status!="200"}[30s]))
                or on(workload,endpoint) (0 * sum by(workload,endpoint) (increase(ignite_workload_requests_total[30s]))))
                and on() count(ignite_workload_queue_depth)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
      - uid: ignite-support-overdue
        title: Support requests overdue (Drasi)
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Drasi reports customer-support requests past their 15-second deadline.
          __dashboardUid__: ignite-workload
          __panelId__: "7"
        labels:
          component: workload
        data:
          - refId: A
            datasourceUid: ignite-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              # Drasi's Prometheus reaction (tile-overdue). No series is 0 only while the
              # reaction's input is ready; otherwise Unknown, which is NoData (OK).
              expr: >-
                max((max(ignite_drasi_overdue_requests{workload="support"})
                and on() (drasi_reaction_input_ready{output="overdue"} == 1))
                or on() ((drasi_reaction_input_ready{output="overdue"} == 1) * 0))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 60, to: 0}
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
