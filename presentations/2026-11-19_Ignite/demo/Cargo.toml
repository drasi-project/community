[workspace]
members = [
    "settings", "ops/config", "workloads",
    # This demo's native plugins (plan/contracts.md): good_lp optimizer, Prometheus reaction.
    # The Rego policy is Drasi's drasi.standard/policy (drasi/policy).
    "plugins/optimizer", "plugins/prometheus",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
