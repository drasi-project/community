[workspace]
members = [
    "domain", "settings", "ops/config", "workloads",
    # Today's plugins; removed by graph integration (workstream 7) once replaced.
    "plugins/capacity", "plugins/decisions",
    # Drasi-native plugins (plan/contracts.md): Rego policy, good_lp optimizer, Prometheus reaction.
    "plugins/policy", "plugins/optimizer", "plugins/prometheus",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
