[workspace]
members = [
    "settings", "ops/config", "workloads",
    # This demo's native plugin (plan/contracts.md): the Prometheus reaction. The Rego
    # policy and the optimizer are Drasi's drasi.standard/policy and
    # drasi.standard/optimization (drasi/policy, drasi/optimization).
    "plugins/prometheus",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
